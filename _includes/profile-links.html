{%- comment -%} Profile links from _data/profile.yml: an icon plus a label (each style decides whether the label shows). {%- endcomment -%}
<ul class="profile-links" aria-label="Profiles">
  {%- for link in site.data.profile.links %}
  <li><a href="{{ link.url }}" target="_blank" rel="noopener">{% include icon.html name=link.id %}<span class="profile-links__label">{{ link.label }}</span>{% include newtab.html %}</a></li>
  {%- endfor %}
</ul>
