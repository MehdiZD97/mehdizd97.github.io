{%- comment -%}
  Structured data for a story (PLAN 4.8): a schema.org BlogPosting and the
  BreadcrumbList that matches the visible breadcrumb (News / Stories). Uses
  `og_image` and `description` from head.html.
{%- endcomment -%}
{%- assign po_news = '/news/' | absolute_url -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "BlogPosting",
      "headline": {{ page.title | jsonify }},
      "description": {{ description | jsonify }},
      "image": [{{ og_image | absolute_url | jsonify }}],
      "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
      "dateModified": {{ page.last_modified_at | default: page.date | date_to_xmlschema | jsonify }},
      "author": { "@type": "Person", "name": {{ site.data.profile.name | jsonify }}, "url": {{ '/' | absolute_url | jsonify }} },
      "mainEntityOfPage": {{ page.url | absolute_url | jsonify }},
      "url": {{ page.url | absolute_url | jsonify }}
    },
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "News", "item": {{ po_news | jsonify }} },
        { "@type": "ListItem", "position": 2, "name": "Stories", "item": {{ po_news | append: '#stories' | jsonify }} },
        { "@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }} }
      ]
    }
  ]
}
</script>
