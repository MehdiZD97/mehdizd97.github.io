{%- comment -%} One story (post) in a list: date, linked title, and the first paragraph. {%- endcomment -%}
{%- assign p = include.post -%}
<li class="row-item">
  <time class="row-when" datetime="{{ p.date | date: '%Y-%m-%d' }}">{{ p.date | date: "%b %-d, %Y" }}</time>
  <span class="row-what"><a href="{{ p.url | relative_url }}">{{ p.title }}</a></span>
  <p class="row-note">{{ p.excerpt | strip_html | normalize_whitespace | truncatewords: 32 }}</p>
</li>
