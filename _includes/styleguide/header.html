{%- comment -%} Site header demo: monogram and name, navigation, Contact button, theme toggle, mobile menu. {%- endcomment -%}
<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="#top">
      <span class="brand__mark" aria-hidden="true">MZ</span>
      <span class="brand__name">Mehdi Zafari</span>
    </a>
    <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-menu" data-menu-button>
      {% include styleguide/icon.html name="menu" %}<span>Menu</span>
    </button>
    <div class="site-menu" id="site-menu" data-menu>
      <nav class="site-nav" aria-label="Main">
        <ul>
          <li><a href="#top" aria-current="page">Research</a></li>
          <li><a href="#publications">Publications</a></li>
          <li><a href="#talks">Talks</a></li>
          <li><a href="#videos">Teaching</a></li>
          <li><a href="#top">CV</a></li>
        </ul>
      </nav>
      <a class="btn btn--primary site-header__contact" href="#contact">Contact</a>
    </div>
    <button class="theme-toggle" type="button" aria-pressed="false" data-theme-toggle>
      <span class="theme-toggle__icon theme-toggle__icon--sun">{% include styleguide/icon.html name="sun" %}</span>
      <span class="theme-toggle__icon theme-toggle__icon--moon">{% include styleguide/icon.html name="moon" %}</span>
      <span class="visually-hidden">Dark theme</span>
    </button>
  </div>
</header>
