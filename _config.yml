# Site settings for mehdizd97.github.io (Jekyll 4, built by GitHub Actions).
# Content lives in _data/, _pages/, _posts/, and the collections; this file
# holds settings only. Restart `bundle exec jekyll serve` after editing it.

title: Mehdi Zafari
description: "Mehdi Zafari is a Ph.D. candidate at UC Irvine researching signal processing and AI/ML for next-generation (5G/6G) wireless systems, cell-free MIMO, and ISAC."
url: https://mehdizd97.github.io
baseurl: ""
lang: en-US
timezone: America/Los_Angeles

# Style: cooperative (B, the main style) or instrument (A, the alternate).
# Both are built from _sass/ with the palettes in _data/design.yml.
design: cooperative

# Contact form endpoint (Formspree). Keep it: the contact page posts here.
formspree: https://formspree.io/f/mwppwoye

# Publications: one file per item in _publications/, named by its slug
# (PLAN 4.4). Old v1 URLs redirect through each file's redirect_from.
collections:
  publications:
    output: true
    permalink: /publications/:name/

defaults:
  - scope: { path: "", type: pages }
    values: { layout: page }
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: publications }
    values: { layout: publication }

# Author names shown in bold in publication lists.
author_highlight: ["M. Zafari", "Mehdi Zafari"]

# Labels and icons for DOI links, chosen by DOI prefix; any other prefix
# gets doi_default. A new publisher never needs a template change.
doi_labels:
  - { prefix: "10.1109/", label: IEEE Xplore, icon: ieee }
  - { prefix: "10.21227/", label: IEEE DataPort, icon: database }
doi_default: { label: DOI, icon: link }

# Home page: how many news items the News section shows.
home:
  news: 8

# Stories (posts) set their own permalinks: /posts/YYYY/MM/blog-post-N/.
permalink: /:categories/:title/
future: true
excerpt_separator: "\n\n"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

# Folders starting with "_" are skipped unless listed here.
include:
  - _pages

exclude:
  - CLAUDE.md
  - README.md
  - UPDATING.md
  - LICENSE
  - scripts/
  - Gemfile
  - Gemfile.lock
  - .ruby-version
  - vendor/
  - node_modules/
  - package-lock.json
