# description: one or two sentences (the two YouTube posts' text moved here in Stage 4)
# host: only for videos published on someone else's channel (credited to Mehdi)
# start: seconds where Mehdi's part begins in a longer video
# duration: ISO 8601, as YouTube lists it
# note: short line under the title on the card
# source_title: title of the longer video that a `start` points into
# Home shows the newest `home.videos` (in _config.yml); /videos/ shows all. See GUIDE.md.
#
# New uploads also show by themselves (PLAN 10.3): before every GitHub build,
# and once a week, scripts/fetch_videos.py reads the channel's public feed
# (its 15 newest uploads) into _data/youtube.yml, which Git does not track.
# An entry below wins over the feed's (add one to give an upload a note or a
# start time, or to keep it once it leaves the feed); `skip:` hides uploads.

