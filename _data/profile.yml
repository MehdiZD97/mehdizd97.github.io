# TODO(mehdi): approve or rewrite the bio (third person, for the CV page and structured data; built only from CV facts)
bio: |-
  Mehdi Zafari is a Ph.D. candidate in Electrical Engineering and Computer Science at the University of California, Irvine, advised by Prof. A. Lee Swindlehurst. His research develops signal processing and AI/ML methods for next-generation (5G/6G) wireless systems, with a focus on cell-free MIMO and integrated sensing and communication (ISAC): distributed optimization (ADMM and consensus) for beamforming and resource allocation, and reinforcement learning and graph neural networks for cooperative ISAC networks.

  He also builds and measures real systems. At Rice University, where he earned his M.S. in Electrical and Computer Engineering, he ran over-the-air experiments on the RENEW massive MIMO testbed and released over 200 datasets. As a Wireless AI Engineering Intern at Tiami Networks in 2026, he built high-fidelity RF digital twins with NVIDIA Sionna. His honors include the Pia Gratton Endowed Graduate Student Award, the Wireless History Foundation Scholarship Award, and a Best Paper Award finalist selection at the 2025 Asilomar Conference.

