# First person, for the hero (approved 2026-10-07)
intro: I design distributed algorithms and learning methods for cell-free MIMO and integrated sensing and communication, and test them with over-the-air experiments and RF digital twins.

# Third person, for the CV page and structured data (Mehdi's text, 2026-10-07)
bio: |-
  Mehdi Zafari is a Ph.D. candidate in Electrical Engineering and Computer Science at the University of California, Irvine, advised by Prof. A. Lee Swindlehurst. His research develops signal processing and AI algorithms for next-generation wireless communication systems (5G/6G), with a focus on cell-free MIMO and integrated sensing and communication (ISAC).

  He earned his M.S. degree in Electrical and Computer Engineering from Rice University and his B.S. degree from the University of Tehran. At Rice University, he conducted over-the-air channel sounding experiments on the RENEW massive MIMO testbed and released more than 200 datasets. As a Wireless AI Engineering Intern at Tiami Networks in 2026, he built high-fidelity RF digital twins with NVIDIA Sionna. His honors include the Wireless History Foundation Scholarship Award, the Pia Gratton Endowed Graduate Student Award, 3rd place at the UCI Grad Slam 2026, 1st place at the UCI EECS Annual Technology Showcase, and finalist selection for the Best Paper Award at the 2025 Asilomar Conference.

