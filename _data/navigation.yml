# Main menu (PLAN D3), in display order. On a page whose front matter lists
# `sections` (Home, the style guide), items whose `section` is listed scroll
# to it (Home scrolls to the top); elsewhere every item links to its `url`.
# `match`: URL prefixes that mark the item as the current page.

- label: Home
  url: /
  section: top
- label: News
  url: /year-archive/          # Stage 7 moves the news page to /news/
  section: news
  match: [/year-archive/, /news/, /posts/]
- label: Publications
  url: /publications/
  section: publications
  match: [/publications/, /publication/]
- label: CV
  url: /cv/
  section: cv
  match: [/cv/, /talks/]
- label: Videos
  url: /videos/
  section: videos
  match: [/videos/]
