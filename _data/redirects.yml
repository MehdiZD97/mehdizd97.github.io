- { from: /talks/2023-01-conf-2/, to: /cv/#mww-2023 }
- { from: /talks/2023-09-conf-3/, to: /cv/#tldr-2023 }
- { from: /talks/2023-10-conf-4/, to: /cv/#asilomar-2023 }
- { from: /talks/2024-10-conf-5/, to: /cv/#asilomar-2024 }
