# Old addresses that lead into a section of a page (PLAN 4.5). A page's own
# `redirect_from` cannot add a #section, so _plugins/redirects.rb turns each
# entry here into a redirect page (through jekyll-redirect-from).
#   from: the old address; to: where it leads now

