# Originals and output sizes for scripts/optimize_images.py (PLAN 4.2 and 4.7).
# Jekyll skips this folder (its name starts with "_"), so originals are never
# published. After adding or changing an entry, run (from the repo root):
#     .venv/bin/python scripts/optimize_images.py
#
# Each key is the output name under assets/img/; files are <name>-<size>.<ext>.
#   src:      the original, relative to _assets-src/
#   widths:   output widths in px, for images that scale with the layout
#             (srcset with w descriptors, plus a `sizes` attribute), or
#   heights:  output heights in px for fixed-size images (1x, 2x, 3x)
#   fallback: the size used for the <img> src and its width and height
#   crop:     square (optional; center crop)
#   trim:     true (optional; trims fully transparent margins)
#   formats:  default [avif, webp, jpg]; use [webp, png] to keep transparency
#   quality:  optional, overrides the lossy quality (AVIF 60, WebP 80, JPEG 82)
#
# How to add a photo: GUIDE.md.

profile/mehdi-zafari:
  src: images/profile4.jpeg          # TODO(mehdi): a higher-resolution original, if you have one (open input 9)
  crop: square
  widths: [160, 320, 480]
  fallback: 320

logos/logo-uci:
  src: images/my_images/UCI_Seal_Logo.png
  trim: true
  heights: [72, 144, 216]
  fallback: 72
  formats: [webp, png]
  quality: 90        # crisp edges on the small marks
logos/logo-rice:
  src: images/my_images/Rice_Shield_Logo.png
  trim: true
  heights: [72, 144, 216]
  fallback: 72
  formats: [webp, png]
  quality: 90        # crisp edges on the small marks
logos/logo-tehran:
  src: images/my_images/UT_Logo.png
  trim: true
  heights: [72, 144, 216]
  fallback: 72
  formats: [webp, png]
  quality: 90        # crisp edges on the small marks

