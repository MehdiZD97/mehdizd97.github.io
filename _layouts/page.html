---
layout: default
---
{%- comment -%}
  Standard page: title, optional lead, then the content. Markdown content is
  set as prose unless the page sets `prose: false` (pages built from
  components).
{%- endcomment %}
<main class="site-main" id="main">
  <header class="page-header">
    <h1 class="page-title">{{ page.title }}</h1>
    {%- if page.lead %}
    <p class="page-lead">{{ page.lead }}</p>
    {%- endif %}
  </header>
  <div class="page-content {% if page.prose == false %}page-flow{% else %}prose{% endif %}">
    {{ content }}
  </div>
</main>
