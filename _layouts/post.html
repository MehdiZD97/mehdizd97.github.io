---
layout: default
---
{%- comment -%} Story (post): title, date, and the write-up. Stage 7 polishes stories. {%- endcomment %}
{%- assign news = site.data.navigation | where: "section", "news" | first %}
<main class="site-main" id="main">
  <article class="post">
    <header class="page-header">
      <h1 class="page-title">{{ page.title }}</h1>
      <p class="page-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
    </header>
    <div class="page-content prose">
      {{ content }}
    </div>
    <p class="more-link"><a href="{{ news.url | relative_url }}">All news and posts</a></p>
  </article>
</main>
